# Publishes the teaching page, the compendium and the agent files to GitHub Pages on every push to main.
# Deployed: site/index.html as the home page, the compendium as compendium.html, and llms.txt,
# guide-index.json and every tracked Markdown file except the run records in tests/live/, at their
# repository paths, so an agent can read https://seintun.github.io/claude-guides/llms.txt, ENTRY.md and routes/.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # the build runs no authenticated git commands
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp docs/orchestrating-claude-compendium.html _site/compendium.html
          git ls-files -z -- '*.md' llms.txt guide-index.json ':!:tests/live/**' | tar --null -T - -cf - | tar -xf - -C _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
