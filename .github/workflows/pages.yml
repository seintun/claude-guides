# Publishes the teaching page and the compendium to GitHub Pages on every push to main.
# Only these two generated files are deployed, not the repository.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # the build runs no authenticated git commands
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp docs/orchestrating-claude-compendium.html _site/compendium.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
